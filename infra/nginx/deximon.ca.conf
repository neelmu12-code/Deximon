# Per-client edge limits. This file is loaded inside Nginx's http context.
limit_req_zone $binary_remote_addr zone=deximon_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=deximon_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=deximon_reset:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=deximon_scan:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=deximon_mock_scan:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=deximon_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=deximon_scan_connections:10m;

server {
    server_name deximon.ca www.deximon.ca;

    client_max_body_size 12m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, rather than append, so clients cannot spoof the IP FastAPI sees.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Exact public API routes receive tighter limits before the general gateway.
    location = /api/auth/register {
        client_max_body_size 32k;
        limit_req zone=deximon_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/register;
    }

    location = /api/auth/login {
        client_max_body_size 32k;
        limit_req zone=deximon_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/login;
    }

    location = /api/auth/forgot-password {
        client_max_body_size 16k;
        limit_req zone=deximon_reset burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/forgot-password;
    }

    location = /api/auth/reset-password {
        client_max_body_size 32k;
        limit_req zone=deximon_reset burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/reset-password;
    }

    location = /api/scan {
        client_max_body_size 12m;
        limit_req zone=deximon_scan burst=2 nodelay;
        limit_conn deximon_scan_connections 2;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000/scan;
    }

    location = /api/scan/mock {
        client_max_body_size 12m;
        limit_req zone=deximon_mock_scan burst=5 nodelay;
        limit_conn deximon_scan_connections 2;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000/scan/mock;
    }

    location = /api/profiles/me/avatar {
        client_max_body_size 6m;
        limit_req zone=deximon_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/profiles/me/avatar;
    }

    # Main API gateway for the single-domain frontend. /api/foo -> FastAPI /foo.
    location /api/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:8000/;
    }

    # Compatibility for the old OAuth success URL.
    location = /auth/success { return 302 /binder; }

    # Backward-compatible direct routes use the same edge protection.
    location = /auth/register {
        client_max_body_size 32k;
        limit_req zone=deximon_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /auth/login {
        client_max_body_size 32k;
        limit_req zone=deximon_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /auth/forgot-password {
        client_max_body_size 16k;
        limit_req zone=deximon_reset burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /auth/reset-password {
        client_max_body_size 32k;
        limit_req zone=deximon_reset burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /scan {
        client_max_body_size 12m;
        limit_req zone=deximon_scan burst=2 nodelay;
        limit_conn deximon_scan_connections 2;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /scan/mock {
        client_max_body_size 12m;
        limit_req zone=deximon_mock_scan burst=5 nodelay;
        limit_conn deximon_scan_connections 2;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /profiles/me/avatar {
        client_max_body_size 6m;
        limit_req zone=deximon_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /health { proxy_pass http://127.0.0.1:8000; }
    location ^~ /auth/ { proxy_pass http://127.0.0.1:8000; }
    location ^~ /profiles/ { proxy_pass http://127.0.0.1:8000; }
    location ^~ /cards/ { proxy_pass http://127.0.0.1:8000; }
    location = /binder/me { proxy_pass http://127.0.0.1:8000; }
    location ^~ /binder/cards { proxy_pass http://127.0.0.1:8000; }
    location ^~ /binder/pages { proxy_pass http://127.0.0.1:8000; }
    location = /binder/move { proxy_pass http://127.0.0.1:8000; }
    location ^~ /market/listings { proxy_pass http://127.0.0.1:8000; }
    location ^~ /conversations { proxy_pass http://127.0.0.1:8000; }
    location ^~ /reviews/ { proxy_pass http://127.0.0.1:8000; }
    location ^~ /static/ { proxy_pass http://127.0.0.1:8000; }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deximon.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deximon.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.deximon.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = deximon.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name deximon.ca www.deximon.ca;
    return 404; # managed by Certbot
}
