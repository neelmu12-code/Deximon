openapi: 3.1.0
info:
  title: Deximon - Chat & Notification API
  version: 0.1.0
  description: Listing-scoped conversations, persisted messages, and WebSocket starter endpoint.
servers:
  - url: http://localhost:8000
    description: Local
paths:
  /conversations:
    get:
      summary: List conversations for the authenticated user.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Conversations where the user is requester or seller.
    post:
      summary: Get or create a buyer conversation for a listing.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Conversation payload.
  /conversations/{conversation_id}:
    get:
      summary: Get one conversation with message history.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation with messages.
  /conversations/{conversation_id}/messages:
    get:
      summary: List messages in a conversation.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message history.
    post:
      summary: Send and persist a message in a conversation.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: Created message.
  /conversations/{conversation_id}/ws:
    get:
      summary: Authenticated WebSocket starter for a conversation.
      description: Accepts the auth cookie or a token query parameter. Current behavior persists incoming text messages and echoes them to the sender; multi-client fanout is a TODO.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: WebSocket protocol switch.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MessageCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
